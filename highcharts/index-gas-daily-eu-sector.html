<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Daily Gas Demand by Sector</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pym/1.3.2/pym.v1.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts/load-highcharts.js" data-highcharts-bundle="stock"></script>

    <link rel="stylesheet" href="styles/styles-gas-daily-eu-sector.css">
    <script src="scripts/scripts-gas-daily-eu-sector.js"></script>
</head>

<body>
    <div id="main-container">
        <div id="chart-layout">
            <div id="chart-container"></div>
            <div id="controls-panel">
                <label class="control-label" for="country-select">Country or region</label>
                <select id="country-select"></select>
            </div>
        </div>
    </div>
    <div class="note-container">
        <p>
            Lines show 30-day trailing averages of daily demand, aggregated across the countries available
            for each sector in the cleaned dataset. Coverage differs by sector, so line levels are not based
            on a single fixed country basket.
        </p>
    </div>
</body>

</html>
