<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly gas demand — clustered bars</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pym/1.3.2/pym.v1.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts/load-highcharts.js" data-highcharts-bundle="core"></script>

    <link rel="stylesheet" href="styles/styles-gas-montly-average.css">
    <script src="scripts/scripts-gas-monthly-average-bars.js"></script>
</head>

<body>
    <div id="main-container">
        <div id="chart-legend-container">
            <div id="chart-container"></div>

            <div id="legend-container-parent">
                <div id="controls"></div>

                <label for="country-select" style="color: grey; font-family: Arial, sans-serif; font-size: 12px; display: block; margin-bottom: 5px;">
                    Select a country to visualise:
                </label>
                <select id="country-select" style="margin-bottom: 10px;"></select>

                <label for="type-select" style="color: grey; font-family: Arial, sans-serif; font-size: 12px; display: block; margin-bottom: 5px;">
                    Select a type to visualise:
                </label>
                <select id="type-select" style="margin-bottom: 10px;"></select>
            </div>
        </div>
    </div>

    <div class="note-container">
        <p></p>
    </div>
</body>

</html>
